name: Create GitHub Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          # v4 caches only when this input names a package manager.
          cache: ""

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Verify curated release baseline
        run: |
          test -s RELEASE_BODY.md
          EXPECTED_TAG="$(node -p "'v' + require('./package.json').version.split('.')[0]")"
          test "$GITHUB_REF_NAME" = "$EXPECTED_TAG"

      - name: Install dependencies
        run: npm ci

      - name: Lint maintained source
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run Node test suite
        run: npm run test:node

      - name: Run interactive model tests
        run: npm run test:odyssey

      - name: Build the release artifact
        run: npm run build

      - name: Verify the built site
        run: npm run test:artifact

      - name: Run release artifact tests
        run: npm run test:release

      - name: Scan for PII, secrets, private topology, and backups
        run: python scripts/public_repo_guard.py

      - name: Verify release consistency
        run: python scripts/check_release_consistency.py

      - name: Check Python syntax
        run: |
          python -m py_compile \
            scripts/public_repo_guard.py \
            scripts/check_release_consistency.py \
            scripts/check_committed_whitespace.py

      - name: Check whitespace
        run: python scripts/check_committed_whitespace.py
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: ${{ github.ref_name }} — ZeusApollo Sovereign AI Infrastructure
          body_path: RELEASE_BODY.md
          draft: false
          prerelease: false
          make_latest: true
