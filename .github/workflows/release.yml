name: Create GitHub Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4

      - name: Verify curated release notes
        run: test -s RELEASE_BODY.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }} — ZeusApollo Sovereign AI Infrastructure
          body_path: RELEASE_BODY.md
          draft: false
          prerelease: false
          make_latest: true
