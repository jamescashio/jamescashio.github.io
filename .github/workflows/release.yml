name: Create GitHub Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify curated release baseline
        run: |
          test -s RELEASE_BODY.md
          EXPECTED_TAG="$(node -p "'v' + require('./package.json').version.split('.')[0]")"
          test "$GITHUB_REF_NAME" = "$EXPECTED_TAG"

      - name: Install dependencies
        run: npm ci

      - name: Lint maintained source
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run Node test suite
        run: npm run test:node

      - name: Run interactive model tests
        run: npm run test:odyssey

      - name: Build the release artifact
        run: npm run build

      - name: Verify the built site
        run: npm run test:artifact

      - name: Run release artifact tests
        run: npm run test:release

      - name: Scan for PII, secrets, private topology, and backups
        run: python scripts/public_repo_guard.py

      - name: Verify release consistency
        run: python scripts/check_release_consistency.py

      - name: Check Python syntax
        run: |
          python -m py_compile \
            scripts/public_repo_guard.py \
            scripts/check_release_consistency.py \
            scripts/check_committed_whitespace.py

      - name: Check whitespace
        run: python scripts/check_committed_whitespace.py
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          RELEASE_TITLE="$GITHUB_REF_NAME — ZeusApollo Sovereign AI Infrastructure"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$RELEASE_TITLE" \
              --notes-file RELEASE_BODY.md --draft=false --prerelease=false --latest
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$RELEASE_TITLE" \
              --notes-file RELEASE_BODY.md --latest
          fi
