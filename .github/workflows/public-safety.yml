name: Public Site Safety

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-safety-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  public-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Scan for PII, secrets, private topology, and backups
        id: safety_scan
        continue-on-error: true
        run: python scripts/public_repo_guard.py

      - name: Verify release consistency
        id: release_consistency
        continue-on-error: true
        run: python scripts/check_release_consistency.py

      - name: Upload safety report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: public-safety-report
          path: public-safety-report.txt
          if-no-files-found: error
          retention-days: 14

      - name: Enforce validation results
        if: steps.safety_scan.outcome != 'success' || steps.release_consistency.outcome != 'success'
        run: exit 1

      - name: Check Python syntax
        run: |
          python -m py_compile \
            scripts/public_repo_guard.py \
            scripts/check_release_consistency.py \
            scripts/zeusapollo_swarm.py \
            scripts/zeusapollo_bridge.py
