name: Live Release Verification (isolated branch)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: first-contact-live-verification
  cancel-in-progress: false

jobs:
  live-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout approved release and isolated verification helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Set up pinned Chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4
        id: chrome
        with:
          chrome-version: 147.0.7727.57
      - name: Configure pinned Chrome
        run: |
          sudo chown root:root /opt/google/chrome/chrome-sandbox
          sudo chmod 4755 /opt/google/chrome/chrome-sandbox
      - name: Install locked test dependencies
        run: npm ci
      - name: Exercise the public HTTPS site
        id: checks
        continue-on-error: true
        env:
          V40_URL: https://cashio.us/
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          CHROME_DEVEL_SANDBOX: /opt/google/chrome/chrome-sandbox
        run: |
          mkdir -p outputs
          node --test --test-reporter=tap --test-concurrency=1 tests/v42-runtime.test.mjs tests/v42-cinematic.test.mjs 2>&1 | tee outputs/live-browser-tests.log
      - name: Capture live desktop and phone interactions
        id: captures
        if: always() && steps.chrome.outcome == 'success'
        continue-on-error: true
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          CHROME_DEVEL_SANDBOX: /opt/google/chrome/chrome-sandbox
        run: |
          mkdir -p outputs
          node scripts/release-live-capture.mjs 2>&1 | tee outputs/live-capture.log
      - name: Save live evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: first-contact-live-verification
          path: |
            outputs/
            output/playwright/first-contact-live/
          retention-days: 14
      - name: Enforce the live results
        if: always() && (steps.checks.outcome != 'success' || steps.captures.outcome != 'success')
        run: exit 1
