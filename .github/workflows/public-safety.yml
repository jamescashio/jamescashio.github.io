name: Public Site Safety

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-safety-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  public-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up pinned Chrome
        uses: browser-actions/setup-chrome@v2
        id: setup_chrome
        with:
          chrome-version: 147.0.7727.57

      - name: Configure the pinned Chrome sandbox
        run: |
          sudo chown root:root /opt/google/chrome/chrome-sandbox
          sudo chmod 4755 /opt/google/chrome/chrome-sandbox
          test "$(stat -c '%U:%G %a' /opt/google/chrome/chrome-sandbox)" = "root:root 4755"

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: npm ci

      - name: Lint maintained source
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: Check formatting
        id: format
        continue-on-error: true
        run: npm run format:check

      - name: Run Node test suite
        id: node_tests
        continue-on-error: true
        run: npm run test:node

      - name: Run interactive model tests
        id: odyssey_tests
        continue-on-error: true
        run: npm run test:odyssey

      - name: Build the Pages artifact
        id: build
        continue-on-error: true
        run: npm run build

      - name: Verify the built site
        id: artifact_tests
        continue-on-error: true
        run: npm run test:artifact

      - name: Verify legacy layout in pinned Chrome
        id: layout_runtime
        continue-on-error: true
        run: npm run check:layout:runtime:pinned
        env:
          CHROME_PATH: ${{ steps.setup_chrome.outputs.chrome-path }}
          CHROME_DEVEL_SANDBOX: /opt/google/chrome/chrome-sandbox

      - name: Verify V36 in pinned Chrome
        id: v36_runtime
        continue-on-error: true
        run: npm run check:v36:runtime:pinned
        env:
          CHROME_PATH: ${{ steps.setup_chrome.outputs.chrome-path }}
          CHROME_DEVEL_SANDBOX: /opt/google/chrome/chrome-sandbox

      - name: Run release artifact tests
        id: release_tests
        continue-on-error: true
        run: npm run test:release

      - name: Scan for PII, secrets, private topology, and backups
        id: safety_scan
        continue-on-error: true
        run: python scripts/public_repo_guard.py

      - name: Verify release consistency
        id: release_consistency
        continue-on-error: true
        run: python scripts/check_release_consistency.py

      - name: Check Python syntax
        id: python_syntax
        continue-on-error: true
        run: |
          python -m py_compile \
            scripts/public_repo_guard.py \
            scripts/check_release_consistency.py \
            scripts/check_committed_whitespace.py

      - name: Check whitespace
        id: whitespace
        continue-on-error: true
        run: python scripts/check_committed_whitespace.py
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}

      - name: Upload safety report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: public-safety-report
          path: public-safety-report.txt
          if-no-files-found: error
          retention-days: 14

      - name: Enforce validation results
        if: steps.install.outcome != 'success' || steps.lint.outcome != 'success' || steps.format.outcome != 'success' || steps.node_tests.outcome != 'success' || steps.odyssey_tests.outcome != 'success' || steps.build.outcome != 'success' || steps.artifact_tests.outcome != 'success' || steps.layout_runtime.outcome != 'success' || steps.v36_runtime.outcome != 'success' || steps.release_tests.outcome != 'success' || steps.safety_scan.outcome != 'success' || steps.release_consistency.outcome != 'success' || steps.python_syntax.outcome != 'success' || steps.whitespace.outcome != 'success'
        run: exit 1
