name: Mirror storm page to Cloudflare
on:
  push:
    branches: [main]
    paths:
      - public/storm/**
      - public/favicon.svg
      - public/brand/celestial-420.webp
      - public/brand/celestial-840.webp
      - cloudflare/storm-worker.jsonc
      - .github/workflows/storm-worker.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: storm-worker
  cancel-in-progress: true
jobs:
  deploy:
    # Manual runs may pick any ref; only main ever reaches the production Worker.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Assemble the static asset bundle
        run: |
          rm -rf dist-storm
          mkdir -p dist-storm/storm dist-storm/brand
          cp public/storm/index.html dist-storm/storm/index.html
          cp public/storm/index.html dist-storm/index.html
          cp public/favicon.svg dist-storm/favicon.svg
          cp public/brand/celestial-420.webp public/brand/celestial-840.webp dist-storm/brand/
          cp public/storm/index.html dist-storm/404.html
          find dist-storm -type f | sort
      - name: Require Cloudflare credentials
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          test "$HAS_TOKEN" = "true" || { echo "::error::CLOUDFLARE_API_TOKEN secret is missing"; exit 1; }
          test "$HAS_ACCOUNT" = "true" || { echo "::error::CLOUDFLARE_ACCOUNT_ID secret is missing"; exit 1; }
      - name: Deploy the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config cloudflare/storm-worker.jsonc
