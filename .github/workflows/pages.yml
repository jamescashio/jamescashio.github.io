name: Deploy cashio.us
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: browser-actions/setup-chrome@v2
        id: setup_chrome
        with:
          chrome-version: 147.0.7727.57
      - name: Configure the pinned Chrome sandbox
        run: |
          sudo chown root:root /opt/google/chrome/chrome-sandbox
          sudo chmod 4755 /opt/google/chrome/chrome-sandbox
          test "$(stat -c '%U:%G %a' /opt/google/chrome/chrome-sandbox)" = "root:root 4755"
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:node
      - run: npm run build
      - run: npm run check:layout:runtime:pinned
        env:
          CHROME_PATH: ${{ steps.setup_chrome.outputs.chrome-path }}
          CHROME_DEVEL_SANDBOX: /opt/google/chrome/chrome-sandbox
      - run: npm run test:release
      - run: python scripts/public_repo_guard.py
      - run: python scripts/check_release_consistency.py
      - name: Check Python syntax
        run: |
          python -m py_compile \
            scripts/public_repo_guard.py \
            scripts/check_release_consistency.py \
            scripts/check_committed_whitespace.py
      - run: python scripts/check_committed_whitespace.py
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
