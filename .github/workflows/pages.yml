name: Deploy cashio.us
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions: {}
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        id: setup_chrome
        with:
          chrome-version: 147.0.7727.57
      - name: Configure the pinned Chrome sandbox
        run: |
          sudo chown root:root /opt/google/chrome/chrome-sandbox
          sudo chmod 4755 /opt/google/chrome/chrome-sandbox
          test "$(stat -c '%U:%G %a' /opt/google/chrome/chrome-sandbox)" = "root:root 4755"
      - run: npm ci
      - name: Check workflow security
        run: |
          python -m pip install --disable-pip-version-check --no-deps --require-hashes -r requirements-workflow-security.txt
          npm run check:workflow-security
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:node
      - run: npm run test:odyssey
      - run: npm run build
      - run: npm run test:artifact
      - run: npm run check:layout:runtime:pinned
        env:
          CHROME_PATH: ${{ steps.setup_chrome.outputs.chrome-path }}
          CHROME_DEVEL_SANDBOX: /opt/google/chrome/chrome-sandbox
      - run: npm run check:v36:runtime:pinned
        env:
          CHROME_PATH: ${{ steps.setup_chrome.outputs.chrome-path }}
          CHROME_DEVEL_SANDBOX: /opt/google/chrome/chrome-sandbox
      - run: npm run check:accessibility
        env:
          CHROME_PATH: ${{ steps.setup_chrome.outputs.chrome-path }}
          CHROME_DEVEL_SANDBOX: /opt/google/chrome/chrome-sandbox
      - run: npm run check:lighthouse
        env:
          CHROME_PATH: ${{ steps.setup_chrome.outputs.chrome-path }}
          CHROME_DEVEL_SANDBOX: /opt/google/chrome/chrome-sandbox
      - run: npm run test:release
      - run: python scripts/public_repo_guard.py
      - run: python scripts/check_release_consistency.py
      - name: Check Python syntax
        run: |
          python -m py_compile \
            scripts/public_repo_guard.py \
            scripts/check_release_consistency.py \
            scripts/check_committed_whitespace.py
      - run: python scripts/check_committed_whitespace.py
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
      - name: Require GitHub Actions Pages source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/${GITHUB_REPOSITORY}/pages --jq .build_type)" = "workflow"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          # Pages must receive the validated security-discovery file as well.
          include-hidden-files: true
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
