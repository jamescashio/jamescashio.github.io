name: Repository Hygiene

on:
  pull_request:
    types: [closed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/branch-hygiene.yml'
  schedule:
    - cron: '23 5 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: repository-hygiene
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Close stale automation PRs and prune closed branches
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const defaultBranch = context.payload.repository?.default_branch || 'main';
            const protectedNames = new Set([defaultBranch, 'gh-pages']);
            const disposablePrefix = /^(sentinel|jules|fix-|testing-|commander-|defiant-|chatgpt\/|security\/|docs\/|chore\/|release\/|ops\/)/i;
            const staleBefore = Date.now() - (21 * 24 * 60 * 60 * 1000);
            const orphanBefore = Date.now() - (30 * 24 * 60 * 60 * 1000);

            const openPulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              per_page: 100
            });

            for (const pr of openPulls) {
              const head = pr.head.ref;
              const stale = new Date(pr.updated_at).getTime() < staleBefore;
              const sameRepo = pr.head.repo?.full_name === `${owner}/${repo}`;
              if (!sameRepo || !stale || !disposablePrefix.test(head)) continue;

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr.number,
                body: 'Closed automatically by the Prime Directive repository-hygiene policy: this automation or preview branch was inactive for more than 21 days and has been superseded by the current `main` baseline. Reopen only if the change is still required and has been rebased.'
              });
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: pr.number,
                state: 'closed'
              });
              core.info(`Closed stale PR #${pr.number}: ${pr.title}`);
            }

            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner,
              repo,
              per_page: 100
            });

            let deleted = 0;
            for (const branch of branches) {
              const name = branch.name;
              if (protectedNames.has(name) || name.startsWith('keep/') || name.startsWith('archive/')) continue;

              const pulls = await github.paginate(github.rest.pulls.list, {
                owner,
                repo,
                head: `${owner}:${name}`,
                state: 'all',
                per_page: 100
              });

              if (pulls.some(pr => pr.state === 'open')) continue;

              let shouldDelete = pulls.length > 0;
              if (!shouldDelete && disposablePrefix.test(name)) {
                try {
                  const commit = await github.rest.repos.getCommit({ owner, repo, ref: name });
                  const date = commit.data.commit.committer?.date || commit.data.commit.author?.date;
                  shouldDelete = Boolean(date && new Date(date).getTime() < orphanBefore);
                } catch (error) {
                  core.warning(`Could not inspect ${name}: ${error.message}`);
                }
              }

              if (!shouldDelete) continue;

              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `heads/${name}`
                });
                deleted += 1;
                core.info(`Deleted branch: ${name}`);
              } catch (error) {
                core.warning(`Could not delete ${name}: ${error.message}`);
              }
            }

            core.summary
              .addHeading('Repository hygiene complete')
              .addRaw(`Pruned ${deleted} closed or stale branches.\n`)
              .addRaw('The default branch, gh-pages, open-PR branches, and keep/archive namespaces were preserved.\n')
              .write();
