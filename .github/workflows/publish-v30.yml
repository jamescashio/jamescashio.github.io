name: Publish v30 Release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v30.yml'
      - 'RELEASE_BODY.md'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'status.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-v30
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify public release baseline
        run: |
          test -s RELEASE_BODY.md
          python scripts/check_release_consistency.py

      - name: Create or update v30 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v30
          target_commitish: main
          name: v30 — The Sleeper Has Awakened
          body_path: RELEASE_BODY.md
          draft: false
          prerelease: false
          make_latest: true
