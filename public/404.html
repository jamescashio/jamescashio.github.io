<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Off the chart · cAshIo</title>
    <meta name="description" content="This address is not part of cashio.us. Head back to orbit." />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#080F1B" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; font-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <link rel="icon" href="/cashio/icon.svg" type="image/svg+xml" />
    <style>
      @font-face {
        font-family: "Unbounded";
        font-weight: 200 900;
        font-display: swap;
        src: url("/v38/fonts/unbounded-latin.woff2") format("woff2");
      }
      @font-face {
        font-family: "Instrument Sans";
        font-weight: 400 700;
        font-display: swap;
        src: url("/v38/fonts/instrument-latin.woff2") format("woff2");
      }
      :root {
        --void: #04070e;
        --ink: #eaf0f8;
        --ink2: #c6d0de;
        --muted: #a9b6c9;
        --cyan: #38e1ff;
        --gold: #f2c87a;
        --line: rgba(56, 225, 255, 0.14);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        display: grid;
        min-height: 100svh;
        place-items: center;
        padding: 32px clamp(16px, 5vw, 72px);
        background:
          linear-gradient(90deg, rgba(4, 7, 14, 0.96) 30%, rgba(4, 7, 14, 0.55)),
          url("/v38/assets/orbit.webp") 70% 50% / cover no-repeat,
          var(--void);
        color: var(--ink);
        font:
          17px/1.6 "Instrument Sans",
          system-ui,
          -apple-system,
          sans-serif;
      }
      main {
        width: min(100%, 640px);
      }
      .kick {
        margin: 0 0 18px;
        color: var(--cyan);
        font:
          600 13px/1.4 ui-monospace,
          Menlo,
          monospace;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font:
          800 clamp(44px, 9vw, 88px) / 1 "Unbounded",
          sans-serif;
        letter-spacing: -0.05em;
      }
      h1 span {
        color: var(--gold);
      }
      p {
        margin: 22px 0 0;
        max-width: 46ch;
        color: var(--ink2);
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 12px 14px;
        margin-top: 32px;
      }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 48px;
        padding: 0 22px;
        border: 1px solid var(--line);
        border-radius: 12px;
        color: var(--ink);
        font-weight: 600;
        text-decoration: none;
      }
      a:first-child {
        border-color: transparent;
        background: linear-gradient(180deg, #f6d894, var(--gold));
        color: #1a1204;
      }
      a:hover {
        border-color: var(--gold);
      }
      a:focus-visible {
        outline: 2px solid var(--cyan);
        outline-offset: 3px;
      }
      .foot {
        margin-top: 40px;
        color: var(--muted);
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="kick">404 · Off the chart</p>
      <h1>Don’t <span>panic.</span></h1>
      <p>
        This address isn’t on the chart. The page may have moved when the site was rebuilt, or the link has a typo.
        Everything current starts from orbit.
      </p>
      <nav aria-label="Ways back">
        <a href="/">Back to orbit</a><a href="/#rooms">The four rooms</a><a href="/#evidence">Dated evidence</a>
      </nav>
      <p class="foot">cashio.us · a personal hobby lab by Doug Cashio</p>
    </main>
  </body>
</html>
