<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="viewport" content="width=1200" />
    <title>cAshIo V39.4 share card source</title>
    <style>
      @font-face {
        font-family: Unbounded;
        src: url("/v38/fonts/unbounded-latin.woff2");
        font-weight: 200 900;
      }
      @font-face {
        font-family: Instrument;
        src: url("/v38/fonts/instrument-latin.woff2");
        font-weight: 400 700;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #080f1b;
        color: #eef3fa;
      }
      main {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        padding: 66px 70px;
        background:
          linear-gradient(90deg, #050a12f2 0%, #050a12d9 32%, #050a1250 64%, #050a1210),
          url("/odyssey/orbit-aurora-v37-1200.avif") center / cover;
      }
      p {
        margin: 0;
      }
      .kicker {
        font:
          600 15px Instrument,
          sans-serif;
        color: #66e2ee;
        letter-spacing: 0.2em;
      }
      h1 {
        font:
          750 72px/1.09 Unbounded,
          sans-serif;
        letter-spacing: -0.055em;
        margin: 30px 0 24px;
      }
      h1 span {
        display: block;
      }
      h1 .gold {
        color: #f2c87a;
      }
      .sub {
        max-width: 570px;
        font:
          400 23px/1.5 Instrument,
          sans-serif;
        color: #d3deed;
      }
      footer {
        position: absolute;
        left: 70px;
        right: 70px;
        bottom: 45px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .brand {
        font:
          750 31px Unbounded,
          sans-serif;
        letter-spacing: -0.04em;
      }
      .brand b {
        color: #f2c87a;
      }
      .brand i {
        font-style: normal;
        color: #66e2ee;
      }
      .address {
        font:
          600 15px Instrument,
          sans-serif;
        color: #f2c87a;
        letter-spacing: 0.18em;
        padding: 11px 16px;
        border: 1px solid #f2c87a66;
        border-radius: 7px;
        background: #080f1baa;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="kicker">DOUG CASHIO / A HUMAN IN COMMAND</p>
      <h1><span>Small lab.</span><span>Big universe.</span><span class="gold">No panic.</span></h1>
      <p class="sub">
        Local AI, original worlds and a few things that fly.<br />Curiosity, with a human at the controls.
      </p>
      <footer><span class="brand">c<b>A</b>sh<i>I</i>o</span><span class="address">EXPLORE · CASHIO.US</span></footer>
    </main>
  </body>
</html>
